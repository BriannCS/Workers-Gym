name: gimnasio_app
description: "Sistema de gestión para gimnasio: clientes, membresías, pagos y asistencia."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.5.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: any
  supabase_flutter: ^2.17.2
  shared_preferences: ^2.5.6
  http: ^1.6.0
  image_picker: ^1.2.4
  pdf: ^3.13.1
  printing: ^5.15.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Sistema "Bitácora": Big Shoulders (marcador deportivo) para titulares y
  # cifras, Archivo para la interfaz, IBM Plex Mono para horas, montos y rótulos.
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-400.ttf
        - asset: assets/fonts/Archivo-500.ttf
          weight: 500
        - asset: assets/fonts/Archivo-600.ttf
          weight: 600
        - asset: assets/fonts/Archivo-700.ttf
          weight: 700
    - family: BigShoulders
      fonts:
        - asset: assets/fonts/BigShoulders-700.ttf
          weight: 700
        - asset: assets/fonts/BigShoulders-800.ttf
          weight: 800
    - family: PlexMono
      fonts:
        - asset: assets/fonts/PlexMono-400.ttf
        - asset: assets/fonts/PlexMono-500.ttf
          weight: 500
        - asset: assets/fonts/PlexMono-600.ttf
          weight: 600
