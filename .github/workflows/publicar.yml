# Hecho por Briann$ Workers Corp.
#
# En cada push a main: pruebas → PWA en GitHub Pages + APK de Android
# (descargable en la pestaña Actions). Con una etiqueta vX.Y.Z además crea una
# Release con el APK adjunto. Secretos necesarios (Settings > Secrets and
# variables > Actions): SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY y, para firmar
# el APK, ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
name: Publicar Workers Gym

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  pruebas:
    name: Análisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  web:
    name: Compilar PWA
    needs: pruebas
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Crear env.json desde los secretos
        run: bash .github/scripts/env_json.sh
      - name: Compilar
        run: >
          flutter build web --wasm --no-web-resources-cdn
          --dart-define-from-file=env.json
          --base-href "/${{ github.event.repository.name }}/"
      - name: Política de seguridad (CSP) para GitHub Pages
        # GitHub Pages no admite encabezados propios (_headers), así que la CSP
        # va como <meta> en index.html. Misma política que web/_headers salvo
        # frame-ancestors (no funciona en <meta>; web/theme.js lo cubre).
        run: |
          host=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https?://##; s#/.*$##')
          csp="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://$host; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://$host wss://$host https://ve.dolarapi.com https://fonts.gstatic.com; worker-src 'self' blob:; frame-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
          sed -i "s#<head>#<head>\n  <meta http-equiv=\"Content-Security-Policy\" content=\"$csp\">#" build/web/index.html
          grep -q 'Content-Security-Policy' build/web/index.html
          rm -f build/web/_headers
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  publicar-web:
    name: Publicar en GitHub Pages
    needs: web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  apk:
    name: APK de Android
    needs: pruebas
    runs-on: ubuntu-latest
    permissions:
      contents: write # solo para adjuntar el APK a la Release
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Crear env.json desde los secretos
        run: bash .github/scripts/env_json.sh
      - name: Llave de firma
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::Sin secretos de firma: el APK sale con la llave de pruebas y no podrá actualizarse encima de otro."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/workers-gym-release.jks
          {
            echo "storeFile=workers-gym-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - name: Compilar APK
        # Versión visible = la etiqueta (v1.0.2 → 1.0.2) o la de pubspec.yaml.
        # Número interno = número de ejecución de Actions: siempre sube, así
        # Android trata cada APK nuevo como actualización del anterior.
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          flutter build apk --release --dart-define-from-file=env.json \
            --build-name "$version" --build-number "${{ github.run_number }}"
      - name: Nombrar APK
        run: |
          version="$VERSION"
          mv build/app/outputs/flutter-apk/app-release.apk "workers-gym-$version.apk"
          echo "APK=workers-gym-$version.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: workers-gym-apk
          path: ${{ env.APK }}
          retention-days: 30
      - name: Adjuntar a la Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" --title "Workers Gym $GITHUB_REF_NAME" --generate-notes
      - name: Borrar la llave del runner
        if: always()
        run: rm -f android/workers-gym-release.jks android/key.properties env.json
